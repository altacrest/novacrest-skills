<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Long-form video cards</title>
<link rel="stylesheet" href="common.css">
<style>
  /* 1920x1080 plates (opaque) and overlays (transparent) for the long video, plus the 1280x720 thumbnail. */
  body { width: 1920px; height: 1080px; position: relative; }
  body.thumb { width: 1280px; height: 720px; }
  .logo { position: absolute; left: 96px; top: 84px; height: 58px; }
  .site { position: absolute; right: 100px; bottom: 76px; font: 700 26px/1 var(--label); letter-spacing: .14em;
    color: var(--line); text-transform: lowercase; }

  /* title card */
  .t-col { position: absolute; left: 160px; right: 160px; top: 0; bottom: 0; display: flex; flex-direction: column;
    justify-content: center; gap: 34px; }
  .t-kick { font-size: 30px; color: var(--line); font-weight: 700; }
  .t-title { font: 900 128px/1.0 var(--title); color: var(--ink); letter-spacing: -.02em; text-wrap: balance; max-width: 1500px; }
  .t-title.long { font-size: 104px; }

  /* section card */
  .s-col { position: absolute; left: 160px; top: 0; bottom: 0; width: 1000px; display: flex; flex-direction: column;
    justify-content: center; gap: 30px; }
  .s-label { font-size: 34px; color: var(--line); font-weight: 700; }
  .s-name { font: 900 120px/1.0 var(--title); color: var(--ink); letter-spacing: -.02em; text-wrap: balance; }
  .s-name.long { font-size: 96px; }
  .berg { position: absolute; right: 120px; top: 120px; width: 620px; height: 840px; }
  .steps { position: absolute; left: 160px; right: 160px; top: 160px; display: flex; gap: 18px; align-items: center; }
  .steps span { font: 700 24px/1 var(--label); letter-spacing: .16em; text-transform: uppercase; color: var(--line);
    opacity: .45; padding: 12px 16px 10px; border: 2px dashed transparent; border-radius: 6px; }
  .steps span.on { opacity: 1; color: var(--ink); border-color: var(--ink); border-style: solid; background: rgba(124,182,242,.25); }
  .steps i { color: var(--line); opacity: .5; font-style: normal; font: 700 26px/1 var(--label); }

  /* stat card */
  .f-col { position: absolute; left: 160px; right: 160px; top: 0; bottom: 0; display: flex; flex-direction: column;
    justify-content: center; gap: 30px; }
  .f-kick { font-size: 28px; color: var(--line); font-weight: 700; }
  .f-big { font: 900 220px/0.95 var(--title); color: var(--ink); letter-spacing: -.03em; }
  .f-big.long { font-size: 150px; }
  .f-small { font: 600 52px/1.2 var(--title); color: var(--text); max-width: 1400px; text-wrap: balance; }
  .f-blob { position: absolute; right: 180px; top: 200px; width: 380px; height: 380px; border-radius: 50%;
    border: 4px solid var(--line); background: rgba(124,182,242,.35); }
  .f-dot { position: absolute; right: 340px; top: 360px; width: 60px; height: 60px; border-radius: 50%; background: var(--ink); }

  /* lower third and question block (transparent overlays) */
  .lower { position: absolute; left: 96px; bottom: 132px; max-width: 1240px; padding: 22px 34px 24px 30px;
    display: flex; flex-direction: column; gap: 12px; }
  .lower .kick { font-size: 22px; color: var(--line); font-weight: 700; }
  .lower .name { font: 800 54px/1.08 var(--title); color: var(--ink); letter-spacing: -.01em; }
  .lower .name b { color: var(--line); font-weight: 900; margin-right: 18px; }
  .question { position: absolute; left: 96px; bottom: 132px; width: 1320px; padding: 30px 40px 34px 34px;
    display: flex; flex-direction: column; gap: 16px; }
  .question .kick { font-size: 26px; color: var(--line); font-weight: 700; }
  .question .q { font: 900 66px/1.08 var(--title); color: var(--ink); letter-spacing: -.015em; text-wrap: balance; }

  /* source tag, badge, pitch card */
  .source { position: absolute; left: 96px; bottom: 54px; max-width: 1400px; font: 400 21px/1.25 var(--label);
    color: var(--ink); background: rgba(234,242,251,.92); padding: 9px 14px 8px; border-radius: 4px;
    letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .source b { font-weight: 700; letter-spacing: .16em; margin-right: 12px; color: var(--line); }
  .badge { position: absolute; right: 72px; top: 64px; }
  .pitch { position: absolute; right: 96px; bottom: 132px; width: 640px; padding: 30px 34px 32px;
    display: flex; flex-direction: column; gap: 18px; border-left: 0; border-top: 8px solid var(--line); border-radius: 0 0 10px 10px; }
  .pitch img { height: 44px; align-self: flex-start; }
  .pitch .say { font: 600 31px/1.3 var(--title); color: var(--text); }
  .pitch .cta { font: 700 26px/1 var(--label); letter-spacing: .1em; color: var(--ink); text-transform: uppercase; }

  /* end card */
  .e-col { position: absolute; left: 140px; top: 0; bottom: 0; width: 760px; display: flex; flex-direction: column;
    justify-content: center; gap: 34px; }
  .e-col img { height: 86px; align-self: flex-start; }
  .e-cta { font: 900 76px/1.05 var(--title); color: var(--ink); letter-spacing: -.015em; text-wrap: balance; }
  .e-site { font: 700 34px/1 var(--label); letter-spacing: .12em; color: var(--line); }
  .e-made { font: 700 22px/1.4 var(--label); letter-spacing: .16em; color: var(--line); text-transform: uppercase; opacity: .85; }
  .e-room { position: absolute; left: 1000px; right: 70px; top: 120px; bottom: 120px; border-left: 3px solid var(--line); opacity: .35; }

  /* thumbnail, 1280x720 */
  .th-img { position: absolute; right: 0; top: 0; width: 760px; height: 720px; object-fit: cover; }
  .th-panel { position: absolute; left: 0; top: 0; width: 600px; height: 720px; padding: 56px 46px; display: flex;
    flex-direction: column; justify-content: center; gap: 22px; border-right: 8px solid var(--line); }
  .th-kick { font-size: 22px; color: var(--line); font-weight: 700; }
  .th-title { font: 900 84px/0.98 var(--title); color: var(--ink); letter-spacing: -.02em; text-wrap: balance; }
  .th-panel img { height: 40px; align-self: flex-start; margin-top: 10px; }
</style>
</head>
<body>
<script>
  // window.BRAND: the brand pack's look, names and folder (render.mjs sets it); window.EXTRA: this card's data.
  const B = window.BRAND || {}, X = window.EXTRA || {}, L = B.look || {};
  const q = new URLSearchParams(location.search), kind = q.get("kind") || X.kind;
  const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const root = document.documentElement.style;
  for (const [k, v] of Object.entries({paper: L.paper, grid: L.grid, "grid-major": L.grid_major, ink: L.ink,
       line: L.line, fill: L.fill, text: L.text})) if (v) root.setProperty("--" + k, v);
  const logo = (dark) => B.dir ? `file://${B.dir}/${dark && L.logo_on_dark ? L.logo_on_dark : L.logo}` : "";
  let html = "";

  function berg(n, cur) {
    // a blueprint iceberg: level 1 is the tip above the waterline, the other levels share the body below it
    const W = 620, H = 840, top = 40, water = 190, bottom = 820;
    const P = [[300,40],[338,92],[362,78],[402,150],[420,190],[468,262],[540,360],[588,470],[600,560],[572,650],
               [520,730],[430,790],[330,820],[230,806],[140,760],[70,680],[34,580],[40,470],[86,360],[150,268],
               [204,190],[236,132],[262,104],[284,62]];
    const ln = L.line || "#1F6FD0", ink = L.ink || "#0B3D91", fill = L.fill || "#7CB6F2";
    const outline = P.map(p => p.join(",")).join(" ");
    const bands = [[top, water]];
    const step = (bottom - water) / Math.max(1, n - 1);
    for (let i = 1; i < n; i++) bands.push([water + (i - 1) * step, water + i * step]);
    let s = `<svg class="berg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
    s += `<defs><clipPath id="c"><polygon points="${outline}"/></clipPath></defs>`;
    bands.forEach(([y0, y1], i) => {
      const on = i + 1 === cur;
      if (on) s += `<rect clip-path="url(#c)" x="0" y="${y0}" width="${W}" height="${y1 - y0}" fill="${fill}" opacity=".85"/>`;
      if (i > 1) s += `<line clip-path="url(#c)" x1="0" y1="${y0}" x2="${W}" y2="${y0}" stroke="${ln}" stroke-width="1.5" opacity=".55" stroke-dasharray="6 6"/>`;
      s += `<text x="${W - 2}" y="${(y0 + y1) / 2 + 8}" text-anchor="end" font-family="JetBrains Mono" font-size="${on ? 26 : 20}" font-weight="${on ? 700 : 400}" fill="${on ? ink : ln}" opacity="${on ? 1 : .55}">${i + 1}</text>`;
    });
    s += `<polygon points="${outline}" fill="none" stroke="${ln}" stroke-width="3.5" stroke-linejoin="round"/>`;
    s += `<line x1="0" y1="${water}" x2="${W - 40}" y2="${water}" stroke="${ln}" stroke-width="3" stroke-dasharray="14 10"/>`;
    s += `<text x="4" y="${water - 14}" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="${ln}">WATERLINE</text>`;
    const [y0, y1] = bands[cur - 1] || bands[0];
    s += `<circle cx="300" cy="${(y0 + y1) / 2}" r="16" fill="${ink}"/>`;
    return s + `</svg>`;
  }

  if (kind === "title") {
    document.body.className = "";
    html = `<div class="paper full ticks"></div><img class="logo" src="${logo()}" alt="">
      <div class="t-col"><div class="t-kick mono">${esc(X.kicker)}</div>
      <div class="t-title${String(X.title || "").length > 34 ? " long" : ""}">${esc(X.title)}</div><div class="rule"></div></div>
      <div class="site">${esc(B.site || "")}</div>`;
  }
  if (kind === "section") {
    const big = X.name || String(X.label || "").toLowerCase().replace(/^\w/, c => c.toUpperCase());
    let side = "";
    if (X.format === "iceberg" && X.levels) side = berg(X.levels, X.n);
    if (X.format === "argument" && X.steps) side = `<div class="steps">${X.steps.map((t, i) =>
      (i ? "<i>→</i>" : "") + `<span class="${i === X.step ? "on" : ""}">${esc(t)}</span>`).join("")}</div>`;
    html = `<div class="paper full ticks"></div>${side}
      <div class="s-col"${X.format === "argument" ? ' style="top:120px"' : ""}>${X.name ? `<div class="s-label mono">${esc(X.label)}</div>` : ""}
      <div class="s-name${String(big).length > 26 ? " long" : ""}">${esc(big)}</div><div class="rule"></div></div>
      <img class="logo" style="left:auto;right:96px;top:auto;bottom:70px;height:44px" src="${logo()}" alt="">`;
  }
  if (kind === "stat") {
    html = `<div class="paper full ticks"></div><div class="f-blob"></div><div class="f-dot"></div>
      <div class="f-col"><div class="f-kick mono">${esc(X.kicker)}</div>
      <div class="f-big${String(X.big || "").length > 9 ? " long" : ""}">${esc(X.big)}</div>
      <div class="f-small">${esc(X.small)}</div></div>`;
  }
  if (kind === "lower") html = `<div class="lower panel">${X.kicker ? `<div class="kick mono">${esc(X.kicker)}</div>` : ""}
      <div class="name">${X.n ? `<b>#${esc(X.n)}</b>` : ""}${esc(X.title)}</div></div>`;
  if (kind === "question") html = `<div class="question panel"><div class="kick mono">${esc(X.kicker)}</div>
      <div class="q">${esc(X.title)}</div></div>`;
  if (kind === "source") html = `<div class="source"><b>SOURCE</b>${esc(X.source)}</div>`;
  if (kind === "badge") html = `<div class="badge pill">${esc(X.text || "AI IMAGE")}</div>`;
  if (kind === "pitch") html = `<div class="pitch panel"><img src="${logo()}" alt="">
      <div class="say">${esc(X.say)}</div><div class="cta">${esc(B.cta || "")}</div></div>`;
  if (kind === "end") html = `<div class="paper full ticks"></div>
      <div class="e-col"><img src="${logo()}" alt=""><div class="e-cta">${esc(X.cta || B.cta || "")}</div>
      <div class="e-site">${esc(B.site || "")}</div><div class="e-made">${esc(X.made || "Made with AI · Sources in the description")}</div></div>`;
  if (kind === "thumb") {
    document.body.className = "thumb";
    html = `<div class="paper full"></div>${X.image ? `<img class="th-img" src="file://${X.image}" alt="">` : ""}
      <div class="th-panel paper"><div class="th-kick mono">${esc(X.kicker)}</div><div class="th-title">${esc(X.title)}</div>
      <img src="${logo()}" alt=""></div>`;
  }
  document.body.insertAdjacentHTML("beforeend", html);
  Promise.all([...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; })))
    .then(() => { window.READY = true; });
</script>
</body>
</html>
